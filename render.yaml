services:
  - type: web
    name: security-log-analyzer-alert-dashboard
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: security_dashboard

      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
