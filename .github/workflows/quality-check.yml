name: Quality Checks

on:
  push:
  pull_request:

jobs:
  python-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile backend Python files
        run: python -m compileall -q backend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check frontend JavaScript syntax
        run: |
          find frontend/js -name '*.js' -print0 | xargs -0 -r -n1 node --check
